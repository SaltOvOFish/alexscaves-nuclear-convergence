# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="${mod_license}"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# The authors of the mod, displayed in the mod UI
authors="${mod_authors}"

# The description text for the mod (multi line!) (#mandatory)
description='''
Alex's Caves: Nuclear Convergence is a bridge mod that unifies the uranium and
nuclear systems of Create Nuclear (atomic nuclear) and Alex's Caves into a single
radiation mechanic centred on Create Nuclear.

Features:
- Radiation unification: Create Nuclear's radiation effect is replaced by Alex's
  Caves' irradiated effect, so both mods share one radiation mechanic.
- Uranium item mapping via recipes, ores, mob drops and structure loot.
- Two fuel rods with different burn yields for Alex's Caves' Nuclear Furnace.
- Alex's Caves' nuclear bomb converts the blast zone into Create Nuclear's
  irradiated_land biome.
- Interchangeable anti-radiation / hazmat armour (radiation and acid resistance).
- A naturally generated "Abandoned Reactor" structure in the Toxic Caves, plus
  four new radrock ores (iron / coal / lead / nitrate).
- Create automation compatibility: item handler capabilities for the Nuclear
  Furnace (and its 4x4 components), metal barrels, gingerbarrel and the Abyssal
  Altar, plus the Abyssal Altar as a mechanical arm interaction point.
- Meltdown linkage: Alex's Caves' nuclear siren and siren light warn when a Create
  Nuclear reactor runs out of control; a meltdown hatches nearby Tremorzilla eggs
  (which are then immune to that blast); the Create Nuclear reactor alarm also
  emits a redstone signal while warning.
- Irradiated cats and ocelots turn into raycats over time.
- Create-style Ponder tutorials (6 pages) for the Nuclear Furnace, Magnetic Quarry and Submarine,
  triggered from their respective items.
- Four new biome ores: Abyssal Thorium Ore, Tuff Thorium Ore, Coprolith Lead Ore and
  Guanostone Nitrate Ore, generated in the Abyssal Chasm and Forlorn Hollows.
- Smelting and blasting recipe: Alex's Caves Muck -> Sea Glass Shards.
- Thorium and Uranium rods can feed a Create blaze burner to trigger superheating
  (1600 and 6400 ticks respectively).
- Autunite Spear: a throwable spear (3.0 melee, 4.0 thrown) that applies 20 seconds
  of Irradiated I on hit and can be picked back up; uses the Limestone Spear sounds.
- Nuka Cola: a drink that grants 10 seconds of Sugar Rush and 10 seconds of Irradiated I.
- A "radiation" item tag plus a catalyst crafting recipe type; the Nuka Cola and
  Limestone Spear -> Autunite Spear recipes keep the surrounding materials.
- Autunite ore in the Toxic Caves' radrock, and Alex's Caves' uranium ore / unrefined
  waste now work as inventory radiation sources.

Requires Create and Create Nuclear. Alex's Caves is optional: both the Up and Neo
ports of 1.21.1 are supported (mixins apply automatically to whichever is present).
'''

# Mixin 配置
[[mixins]]
config="alexscaves_nuclear_convergence.mixins.json"

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    # 'required' requires the mod to exist, 'optional' does not
    # 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
    type="required" #mandatory
    # Optional field describing why the dependency is required or why it is incompatible
    # reason="..."
    # The version range of the dependency
    versionRange="[${neo_version},)" #mandatory
    # An ordering relationship for the dependency.
    # BEFORE - This mod is loaded BEFORE the dependency
    # AFTER - This mod is loaded AFTER the dependency
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Dependency: Create Nuclear (原子核动) —— 硬依赖（直接调用其 BiomeIrradiationService）
[[dependencies.${mod_id}]]
    modId="createnuclear"
    type="required"
    ordering="AFTER"
    side="BOTH"

# Dependency: Create (机械动力) —— 硬依赖（原子核动的父模组；用于注册机械臂交互点类型）
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    ordering="AFTER"
    side="BOTH"

# Optional dependency: Alex's Caves (alexscaves)，兼容 Up 与 Neo 两个移植版
[[dependencies.${mod_id}]]
    modId="alexscaves"
    type="optional"
    ordering="AFTER"
    side="BOTH"
